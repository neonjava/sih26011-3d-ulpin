version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ulpin3d-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - ENVIRONMENT=production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ulpin3d-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ulpin3d-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    networks:
      - ulpin3d-network

networks:
  ulpin3d-network:
    driver: bridge
